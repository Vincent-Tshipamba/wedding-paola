<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne</title>
    <style>
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            background: #0a0809;
            color: #f6efe4;
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 24px;
        }

        h1 {
            color: #f1d48a;
            font-weight: 500;
            margin: 0 0 8px;
        }

        p {
            color: rgba(246, 239, 228, .7);
            max-width: 22rem;
            margin: 0 auto 20px;
        }

        button {
            background: #d4af37;
            color: #0a0809;
            border: 0;
            border-radius: 10px;
            padding: 12px 22px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <h1>Vous êtes hors ligne</h1>
        <p>Cette page nécessite une connexion internet. Le contrôle d'entrée, lui, continue de fonctionner hors ligne
            s'il a déjà été ouvert une fois.</p>
        <button onclick="location.reload()">Réessayer</button>
    </main>
</body>

</html>
